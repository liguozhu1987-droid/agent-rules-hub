# 裁决链机器唯一真源：任何模块不得硬编码 rank / tie_break
# manifest.yaml 的 priority_order 只是本文件的人可读镜像
schema_version: 1
priority_order:
  - rank: 0
    source: session_explicit_instruction
    label: "用户会话显式指令"
    note: "覆盖一切；触及 L0 红线须二次确认并记审计"
    condition: "always"
    runtime_only: true
  - rank: 1
    source: L0_constitution
    label: "L0 宪法"
    note: "override: forbidden，不可被任何自动规则覆盖"
    condition: "layer: L0 且 override: forbidden"
    layer: L0
  - rank: 2
    source: L3_project_temporary
    label: "L3 项目临时"
    note: "status: active 且 now_utc < expires 且 scope 命中当前项目"
    condition: "status: active 且 now_utc < expires 且 scope 命中当前项目"
    layer: L3
  - rank: 3
    source: L1_stable_preference
    label: "L1 稳定偏好"
    note: "全局长期生效"
    condition: "layer: L1 且 status: active"
    layer: L1
  - rank: 4
    source: L2_skill_or_experience
    label: "L2 技能 / 经验区"
    note: "不参与覆盖比较，仅按需加载"
    condition: "不参与覆盖比较"
    participates_in_override: false

tie_break: [specificity_desc, updated_at_desc, priority_asc]

# 无法裁决时的处理：不自行取舍、不编造，暂停并列项向用户提问
unresolvable_action: needs_review
l0_conflict_action: l0_wins_lower_needs_review
time_source: "manifest.published_at"
