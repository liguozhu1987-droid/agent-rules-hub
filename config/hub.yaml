# 全局配置：路径、长度预算、发布范围、版本策略、编码与产物头
schema_version: 1
root: "."

paths:
  constitution: "00-constitution"
  preferences: "10-preferences"
  experience: "20-experience"
  skills: "30-skills"
  projects: "40-projects"
  drafts: "drafts"
  adapters: "90-adapters"
  decisions: "audit/decisions"
  releases: "audit/releases"
  private: "99-private"
  manifest: "manifest.yaml"
  schema: "schema/frontmatter.schema.json"

# 保守预算（经验判断，非官方限制；需按目标工具实测调整，见 README.md 开放问题清单）
length_budget:
  agents_md_bytes: 8192
  claude_md_lines: 200
  copilot_instructions_bytes: 8192
  memory_md_lines: 200
  per_topic_bytes: 2048
  skill_description_max_chars: 1024

publish_scope:
  default: all
  allowed: [all, public]
  public_excludes_sensitivity: [private]
  public_excludes_paths: ["20-experience/", "40-projects/", "99-private/", "audit/decisions/"]

version_strategy:
  format: "YYYY.MM.DD-N"
  current: "2026.11.09-1"
  tag_prefix: "rules/"
  snapshot_path: "audit/releases/{version}/snapshot.json"

generated_header: "<!-- GENERATED BY agent-rules-hub v{version} | source: manifest.yaml | DO NOT EDIT -->"
readonly_marker: "DO NOT EDIT"

runtime:
  encoding: "utf-8"
  newline: "lf"
  bom: false
  time_source: "manifest.published_at"
  write_mode: "atomic_replace"
